<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JourneySphere embed</title>
  <style>
    body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; font: 16px system-ui, sans-serif; }
    journey-sphere { --journey-sphere-height: min(70vh, 580px); }
  </style>
</head>
<body>
  <h1>Places I have visited</h1>
  <journey-sphere places='["上海", "香港", "Singapore"]' center="[25, 115]" zoom="4"></journey-sphere>
  <script type="module" src="../embed.js"></script>
</body>
</html>
