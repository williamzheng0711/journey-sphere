<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>JourneySphere example</title>
<link rel="modulepreload" href="../src/compiled.js">
<link rel="modulepreload" href="../src/compiled-layer.js">
<link rel="modulepreload" href="../src/state.js">
<link rel="modulepreload" href="../data/compiled/manifest.js">
<link rel="preload" as="fetch" href="../data/compiled/world.json" crossorigin>
<link rel="preload" as="fetch" href="../data/compiled/countries/SGP.json" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../src/style.css">
<style>body{margin:24px;font:16px system-ui;color:#243446}#map{height:70vh}button{margin:12px 8px 12px 0;padding:8px}output{overflow-wrap:anywhere}</style>
</head>
<body>
<h1>My journeys</h1>
<div id="map" role="region" aria-label="Visited regions map"></div>
<button id="reset">Reset visits</button><button id="clear">Clear visits</button>
<p><output id="state" aria-live="polite"></output></p>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { createCompiledJourneySphere } from '../src/compiled.js';
const output = document.querySelector('#state');
try {
  const map = await createCompiledJourneySphere('#map', {
    visited: ['SGP:ADM0:SGP'], center: [1.35, 103.82], zoom: 7,
    onChange: ({visited, codeword}) => { output.textContent = `${visited.length} visited regions`; },
  });
  document.querySelector('#reset').onclick = () => map.reset();
  document.querySelector('#clear').onclick = () => map.setVisited([]);
  output.textContent = `${map.getVisited().length} visited regions`;
} catch (error) { output.textContent = error.message; }
</script>
</body>
</html>
